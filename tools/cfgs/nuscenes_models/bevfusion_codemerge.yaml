_BASE_CONFIG_: cfgs/nuscenes_models/bevfusion_mos.yaml

MODEL:
    IMAGE_BACKBONE:
        INIT_CFG:
            checkpoint: /home/zyt/OpenPCDet/pretrained/swint-nuimages-pretrained.pth

DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/nuscenes_dataset.yaml
    DATA_SPLIT: {
        'train': val,
        'test': val
    }
    INFO_PATH: {
        'train': [nuscenes_infos_10sweeps_val.pkl],
        'test': [nuscenes_infos_10sweeps_val.pkl],
    }
    BALANCED_RESAMPLING: False
    POINT_CLOUD_RANGE: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
    CORRUPTION:
        ENABLED: True
        APPLY_IN: ['train', 'test']
        LIDAR_FOG:
            ENABLED: False
            SEVERITY: 1
        IMAGE_FOG:
            ENABLED: False
            SEVERITY: 1
        LIDAR_SPARSITY:
            ENABLED: False
            SEVERITY: 1
        IMAGE_STYLE:
            ENABLED: False
            SEVERITY: 1
        IMAGE_GEOMETRY:
            ENABLED: False
            SEVERITY: 1

TTA:
    METHOD: codemerge

    CODEMERGE_SETTING:
        SELECT_TOPK: 5
        RIDGE_DAMPING: 0.001
        MERGE_SCALE: 0.85
        LOG_INTERVAL: 50
