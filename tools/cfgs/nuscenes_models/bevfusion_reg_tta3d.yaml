# Independent Reg-TTA3D adaptation for BEVFusion on sparse-LiDAR S5.
# NPG noise, score/NMS thresholds, CBU mapping, and Adam weight decay are
# explicit BEVFusion reimplementation choices because the paper omits them.
_BASE_CONFIG_: cfgs/nuscenes_models/bevfusion.yaml

DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/nuscenes_dataset.yaml
    POINT_CLOUD_RANGE: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
    CAMERA_CONFIG:
        USE_CAMERA: True
        IMAGE:
            FINAL_DIM: [256,704]
            RESIZE_LIM_TRAIN: [0.38, 0.55]
            RESIZE_LIM_TEST: [0.48, 0.48]
    DATA_SPLIT:
        train: val
        test: val
    INFO_PATH:
        train: [nuscenes_infos_10sweeps_val.pkl]
        test: [nuscenes_infos_10sweeps_val.pkl]
    BALANCED_RESAMPLING: False
    CORRUPTION:
        ENABLED: True
        APPLY_IN: ['test']
        LIDAR_FOG:
            ENABLED: False
            SEVERITY: 1
        IMAGE_FOG:
            ENABLED: False
            SEVERITY: 1
        LIDAR_SPARSITY:
            ENABLED: True
            MODE: density_dec_global
            SEVERITY: 5
            SEED: 1024
        IMAGE_STYLE:
            ENABLED: False
            SEVERITY: 1
        IMAGE_GEOMETRY:
            ENABLED: False
            SEVERITY: 1
    DATA_PROCESSOR:
        - NAME: mask_points_and_boxes_outside_range
          REMOVE_OUTSIDE_BOXES: True
        - NAME: shuffle_points
          SHUFFLE_ENABLED:
            train: True
            test: False
        - NAME: transform_points_to_voxels
          VOXEL_SIZE: [0.075, 0.075, 0.2]
          MAX_POINTS_PER_VOXEL: 10
          MAX_NUMBER_OF_VOXELS:
            train: 120000
            test: 160000
        - NAME: image_calibrate
        - NAME: image_normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

MODEL:
    TTA_FUSION_ADAPTER:
        ENABLED: False
    FORWARD_ONLY_CONFLICT_ANALYSIS:
        ENABLED: False
    FORWARD_ONLY_GEOMETRY_ANALYSIS:
        ENABLED: False
    DEPTH_ENTROPY_ANALYSIS:
        ENABLED: False
    POST_PROCESSING:
        EVAL_METRIC: nuscenes

OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 2

TTA:
    ENABLED: True
    METHOD: reg_tta3d
    TENT:
        ENABLED: False
    COTTA:
        ENABLED: False
    SAR:
        ENABLED: False
    DPO_BEVFUSION:
        ENABLED: False
    DPO_MATCHER:
        ENABLED: False
    SPCRA:
        ENABLED: False
    FREEZE:
        ENABLED: False
    REG_TTA3D:
        ENABLED: True
        STEPS: 1
        ALLOW_DDP: False
        OPTIMIZER: Adam
        LR: 0.001
        WEIGHT_DECAY: 0.0
        GRAD_NORM_CLIP: 0.0
        NPG_TAU: 1.5
        NPG_EPS: 0.000001
        NPG_NOISE_DISTRIBUTION: normal
        NPG_DIM_MAGNITUDE: 0.1
        NPG_YAW_MAGNITUDE: 0.1
        FINAL_SCORE_THRESH: 0.2
        NMS_THRESH: 0.1
        NMS_PRE_MAXSIZE: 4096
        NMS_POST_MAXSIZE: 500
        CRR_TOP_RATIO: 0.20
        CRR_MARGIN: 0.10
        CRR_WEIGHT: 1.0
        CBU_VARIANCE_MAPPING: theoretical_max
        CBU_ALPHA_MIN: 0.99
        CBU_ALPHA_MAX: 0.999
        FLIP_AXIS: ['x', 'y']
        ROT_RANGE: [-0.78539816, 0.78539816]
        SCALE_RANGE: [0.95, 1.05]
        LOG_INTERVAL: 50
